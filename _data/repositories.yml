# ===========================================================================
#  Projets / dépôts validés affichés sur https://hatatri.github.io/projets/
#  Source de vérité unique : les pages Projets, Chronologie, le flux RSS,
#  les statistiques et la section « Projets » de l'accueil sont générés
#  à partir de ce fichier.
#
#  Ajout automatique : workflow « Ajouter un projet » (voir README.md)
#  Ajout manuel     : copier un bloc ci-dessous puis lancer
#                     python3 scripts/validate_data.py
#
#  Champs :
#    slug        (obligatoire) identifiant unique en kebab-case
#    name        (obligatoire) nom affiché
#    description (obligatoire) une ou deux phrases
#    category    (obligatoire) id présent dans _data/categories.yml
#    added       (obligatoire) date d'ajout au site, format AAAA-MM-JJ
#    repo        dépôt GitHub « propriétaire/nom » (active les badges)
#    url         lien principal si le projet n'est pas sur GitHub
#    homepage    site web du projet (https://…)
#    language    langage principal (alimente les statistiques)
#    tags        liste de mots-clés en minuscules
#    status      actif | en-developpement | archive   (défaut : actif)
#    featured    true pour afficher le projet sur la page d'accueil
#  Au moins un des champs `repo` ou `url` est requis.
# ===========================================================================

