# Mises à jour automatiques (PR hebdomadaires) des actions GitHub et des gems.
# Chaque PR passe par le workflow de validation avant fusion.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    groups:
      gems:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: monthly
